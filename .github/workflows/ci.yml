name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Engine purity (import boundaries)
        run: pnpm lint:boundaries

      - name: Test (with engine coverage threshold)
        run: pnpm test:coverage

      - name: Validate demo data
        run: pnpm validate:demo

      - name: Build
        run: pnpm build
